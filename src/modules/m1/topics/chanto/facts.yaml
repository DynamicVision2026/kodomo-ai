topic: chanto
question: 「ちゃんと しなさい」の「ちゃんと」って、なに？
claims:
  - id: c1
    type: practice
    statement: "Japanese parents commonly use 「ちゃんと」 as a general instruction (e.g. 「ちゃんとしなさい」) without stating, in the moment, what concrete action it requires."
    status: pending
  - id: c2
    type: practice
    statement: "When 「ちゃんと」 is used about tidying a room, it is commonly understood to mean returning items to their designated place."
    status: pending
  - id: c3
    type: practice
    statement: "When 「ちゃんと」 is used about eating a meal, it is commonly understood to mean eating without spilling or making a mess — a different concrete standard from the tidying-room case."
    status: pending
