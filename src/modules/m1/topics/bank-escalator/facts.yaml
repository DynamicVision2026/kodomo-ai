    statement: "Which side is conventionally left open on an escalator varies by region within Japan (for example, differing between the Kanto and Kansai areas), rather than being one single nationwide rule."
    status: approved
    verifiedSource: "Regional custom, not law: most regions (including Kanto/Tokyo) conventionally stand left (keeping the right side open for walkers); Kansai (including Osaka) conventionally stands right (keeping the left side open) — traced to a 1967 Hankyu Railway Umeda Station platform announcement, not a safety regulation. Corroborated by multiple independent Japanese sources; no single government body regulates this custom, consistent with the claim's own framing as regional convention, not universal rule."
