topic: ice
question: こおりは なぜ みずに うくの？
claims:
  - id: c1
    statement: "When water freezes into ice, its molecular structure becomes more open and spread out, so the same mass occupies more volume; as a result, ice is measurably less dense than liquid water (about 9% less dense) and is lighter than the same size/amount of liquid water."
    sourceUrl: "https://www.usgs.gov/water-science-school/science/water-density"
    # research note (search-summarized, UNVERIFIED, not a quote): USGS Water Science School,
    # "Water Density" — search summary states ice is less dense than liquid water (density
    # decreases by about 9% upon freezing) because frozen water molecules align into a regular
    # crystal lattice that takes up more space than the disorganized liquid arrangement, holding
    # the molecules further apart; this lower density is why ice floats.
    excerpt: "UNVERIFIED — HUMAN SOURCE CHECK REQUIRED"
    adultLevelSource: true
    status: pending
  - id: c2
    statement: "Density is mass per unit volume. For the same mass, occupying a larger volume means lower density; equivalently, for the same volume/size, a less dense material contains less mass and is therefore lighter."
    sourceUrl: "https://openstax.org/books/university-physics-volume-1/pages/14-1-fluids-density-and-pressure"
    # research note (search-summarized, UNVERIFIED, not a quote): OpenStax University Physics
    # Volume 1, "14.1 Fluids, Density, and Pressure" (open-source, peer-reviewed university
    # physics textbook) — search summary states density is defined as mass per unit volume
    # (rho = m/V); comparing two objects of the same mass, the one with the larger volume has
    # the lower density.
    excerpt: "UNVERIFIED — HUMAN SOURCE CHECK REQUIRED"
    adultLevelSource: true
    status: pending
  - id: c3
    statement: "An object that is less dense than the fluid it is placed in experiences a net upward buoyant force and floats; this is Archimedes' principle."
    sourceUrl: "https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy"
    # research note (search-summarized, UNVERIFIED, not a quote): OpenStax University Physics
    # Volume 1, "14.4 Archimedes' Principle and Buoyancy" — search summary states an object
    # floats if its average density is less than that of the surrounding fluid, because the
    # fluid pressure difference between the object's top and bottom produces a net upward
    # (buoyant) force equal to the weight of the fluid displaced.
    excerpt: "UNVERIFIED — HUMAN SOURCE CHECK REQUIRED"
    adultLevelSource: true
