    statement: "There is a real system in Japan (police lost-property handling, including the koban system) for holding found items so their original owner can potentially be found and reunited with them."
    status: approved
    verifiedSource: "Real, government-established system: Japan's Lost Property Act (遺失物法) governs how police handle found items — a finder who turns an item in to a police station or koban enables the police to hold it while attempting to locate the original owner (a finder must report to a facility occupant within 24 hours, or to police within 7 days, to retain finder's rights). If unclaimed after roughly 3 months, the finder may become entitled to keep it. Corroborated by multiple official police-agency sources (Tokyo Metropolitan Police, National Police Agency, and several prefectural police lost-property pages), all describing the same reunification-with-owner purpose the claim states — not a legal-instruction claim about what a child is obligated to do, consistent with this file's own moral-instruction-risk caution."
    verifiedVia: "WO-21 Phase 6 factual verification (WebSearch, 2026-09-20) — see docs/WO-21-factual-verification.md for the full citation and resolution log."
