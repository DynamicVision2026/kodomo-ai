topic: bank-gakunen
question: 4月1日と4月2日で、どうして学年が変わる？
claims:
  - id: c1
    type: practice
    statement: "A commonly known fact among children is that whether you're born on April 1st or April 2nd can put you in a different school year (学年) from a classmate born just one day apart."
    status: approved
    approvedBy: "傅豊国 (代表取締役, Beyond Culture 獨歩文化株式会社)"
    approvedAt: "2026-09-20"
  - id: c2
    type: fact
    statement: "A school system that groups children into fixed yearly grades needs some specific date to draw the dividing line somewhere, and Japan's convention places that line at April 1st/2nd."
    status: approved
    verifiedSource: "Real, government-established rule (not merely informal custom): 学校教育法施行規則第59条 sets Japan's school year as April 1 to the following March 31. Civil Code (民法) Article 143's age-counting convention means a person legally turns the next age at the end of the day before their birthday — so a child born April 1 turns 6 at the end of March 31, making them eligible to start school (学校教育法第17条: enrollment from the first school-year start after turning 6) in the same April 1 school-year as children born the previous April 2 through that March 31; a child born April 2 starts the following year's cohort. Corroborated by MEXT's own official guidance page on this exact question."
    verifiedVia: "WO-21 Phase 6 factual verification (WebSearch, 2026-09-20) — see docs/WO-21-factual-verification.md for the full citation and resolution log."
    verifiedAt: "2026-09-20"
  - id: c3
    type: practice
    statement: "A commonly framed way to understand where a school-year cutoff line is drawn is that it's a matter of convention/agreement, not something that could avoid needing a line somewhere."
    status: approved
