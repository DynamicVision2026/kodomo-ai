name: WO-C2b voice samples (manual, never touches production)

# Founder decision (26 Sep 2026): a manual, separate workflow — never wired to `push`/`pull_request`
# — for proving Lesson 1's Text-to-Speech setup works, producing REVIEW samples, and (once the
# Founder approves those samples) the real generation run. It never touches ci.yml's own deploy
# jobs or production traffic — c01 stays blocked in production regardless of mode (the lesson-level
# review fields this gates on are never written here). Reuses ci.yml's existing Workload Identity
# Federation auth (same secrets, same `google-github-actions/auth@v2` step) — no new GCP credential
# is created for this.
#
# Modes (dispatch input `mode`), always run in this order regardless of which one you pick — each
# later mode implies every earlier check already passed:
#   check        - confirms the WIF identity can reach Text-to-Speech and the API is enabled.
#                  Makes exactly one free call (voices.list) — no synthesis, no cost. If the API
#                  isn't enabled, this step fails with the exact console step to fix it.
#   list-voices  - also lists every real ja-JP voice this project's Text-to-Speech can use today,
#                  uploaded as an artifact — the real catalog scripts/audio/generate-c01-lesson.ts's
#                  own VOICES table should be checked against before any sample is generated.
#   samples      - also generates WO-C2b §3's review set (one line per of the 9 roles + the first
#                  ~minute of audio A joined with its sound-effect placeholders) and uploads it as
#                  a workflow artifact. Writes only under public/audio/course/_samples/ — never a
#                  real production path, never c01.lesson.json. Never runs without Founder-visible
#                  approval of this exact dispatch (this workflow doesn't auto-trigger).
#   full         - Founder-approved (26 Sep 2026) real generation: all 250 voiced lines to their
#                  real production paths, the two きく blocks joined, `listen[].transcript[].start`
#                  written back (the ONLY field in c01.lesson.json this touches — self-enforced by
#                  the script itself, not just this workflow). Commits the generated audio files and
#                  the updated c01.lesson.json straight to this run's own branch (never main/a
#                  protected branch — this workflow only ever runs against the branch it was
#                  dispatched on) so the two artifacts below aren't the only place the result lives,
#                  then runs the RELEASE=1 content gate to confirm every one of the 250 files exists.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        type: choice
        options:
          - check
          - list-voices
          - samples
          - full
        default: check

permissions:
  contents: write   # 'full' mode commits generated audio + c01.lesson.json back to the dispatch branch
  id-token: write   # Workload Identity Federation — no long-lived key ever touches this repo

jobs:
  voice-samples:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: kodomo-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Founder decision: REST transport only, never the gRPC client library (the sandbox this
      # workflow was authored in has a proxy that can't reach gRPC — REST via a masked bearer token
      # is also simpler to audit in a CI log than a channel-credentialed gRPC client). This one
      # access token authenticates every REST call scripts/audio/generate-c01-lesson.ts makes below.
      - name: Mint a REST access token
        id: token
        run: |
          TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Instruction 1: "confirm it can call Text-to-Speech and the API is enabled in the project;
      # if it isn't, stop and report the exact console step." Runs for every mode — list-voices and
      # samples both imply this check already passed. voices.list is free (no synthesis charge).
      - name: Check Text-to-Speech access + API enablement
        env:
          GCP_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: npx tsx scripts/audio/generate-c01-lesson.ts --check

      - name: List the real ja-JP voice catalog
        if: ${{ inputs.mode == 'list-voices' || inputs.mode == 'samples' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: npx tsx scripts/audio/generate-c01-lesson.ts --list-voices | tee voices-ja-JP.txt

      - name: Upload the voice catalog
        if: ${{ inputs.mode == 'list-voices' || inputs.mode == 'samples' }}
        uses: actions/upload-artifact@v4
        with:
          name: voices-ja-JP
          path: voices-ja-JP.txt
          retention-days: 14

      # ubuntu-latest images normally already carry ffmpeg, but the join step is a hard
      # requirement (WO-C2b §3's audio-A sample and §4's two real きく masters are both real
      # concats, not just separate lines) — installed explicitly rather than assumed, per
      # instruction 1.
      - name: Install ffmpeg
        if: ${{ inputs.mode == 'samples' || inputs.mode == 'full' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      # WO-C2b §3: one sample line per of the 9 roles + the first ~minute of audio A, joined with
      # its sound-effect placeholders (no real SFX assets exist yet — see runSamples()'s own
      # synthesizeSilence doc comment). Writes only under public/audio/course/_samples/ — never a
      # real production path, never c01.lesson.json.
      - name: Generate voice + audio-A samples
        if: ${{ inputs.mode == 'samples' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: npx tsx scripts/audio/generate-c01-lesson.ts --samples

      - name: Upload samples artifact
        if: ${{ inputs.mode == 'samples' }}
        uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: public/audio/course/_samples/artifact/
          retention-days: 14

      # WO-C2b §4, Founder-approved: every standalone clip to its real path, both きく blocks
      # synthesized then joined with real ffprobe-measured timing, `listen[].transcript[].start`
      # written back (self-enforced as the only field touched — see generate-c01-lesson.ts's own
      # assertOnlyTranscriptStartsChanged). c01 stays blocked in production either way: this never
      # writes the lesson-level review fields gate:course-review checks under RELEASE=1.
      - name: Generate all 250 lines + join the two きく blocks
        if: ${{ inputs.mode == 'full' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: npx tsx scripts/audio/generate-c01-lesson.ts --full

      # Self-check before trusting the run: c01.lesson.json's only CONTENT change from HEAD must be
      # `transcript[].start` additions (the script already refuses to write anything else, but this
      # confirms it from the outside too). Deliberately a structural comparison (parse both
      # versions, strip every transcript[].start, compare) rather than a line-based `git diff` — a
      # line diff false-positives on this file: adding `"start": N` after an existing sibling key
      # also adds a trailing comma to that key's own line, which a naive line-by-line check
      # (an earlier version of this step) misread as an unrelated change.
      - name: Confirm c01.lesson.json's only change is transcript[].start
        if: ${{ inputs.mode == 'full' }}
        run: |
          node --input-type=module -e "
          import { execSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const path = 'src/course/content/lessons/c01.lesson.json';
          const original = JSON.parse(execSync('git show HEAD:' + path).toString());
          const updated = JSON.parse(readFileSync(path, 'utf8'));
          const strip = (obj) => {
            const clone = JSON.parse(JSON.stringify(obj));
            for (const block of clone.listen ?? []) {
              for (const line of block.transcript ?? []) delete line.start;
            }
            return clone;
          };
          if (JSON.stringify(strip(original)) !== JSON.stringify(strip(updated))) {
            console.error('c01.lesson.json changed a field other than transcript[].start');
            process.exit(1);
          }
          console.log(\"OK: c01.lesson.json's only diff is transcript[].start.\");
          "

      # RELEASE=1 also checks c01's own review-approval fields (philosophy/japanese), which stay
      # null by design — instruction 7: "Keep c01 blocked in production." That failure is expected
      # and permanent until the Coordinator separately approves the lesson; it must never block this
      # step. What it DOES still hard-fail on: an actual "audio (file|clip) missing" line, since
      # that's a real generation problem, not an intentional block.
      - name: Gate — release audio-file check (RELEASE=1)
        if: ${{ inputs.mode == 'full' }}
        run: |
          set +e
          OUTPUT=$(RELEASE=1 npx tsx scripts/gate-course-review-approved.ts 2>&1)
          set -e
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qE 'audio (file|clip) missing'; then
            echo "::error::One or more audio files are missing — see output above."
            exit 1
          fi
          echo "OK: no audio files missing (any 'not fully approved' failure above is expected — c01's review fields stay null, c01 stays blocked in production)."

      # Committed straight to this run's own dispatch branch (never main) so the generated audio
      # and the transcript timing live in the repo, not only in this run's own artifact below.
      - name: Commit the generated audio + updated c01.lesson.json
        if: ${{ inputs.mode == 'full' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/course/c01 public/audio/course/shared src/course/content/lessons/c01.lesson.json
          git commit -m "WO-C2b: generate all 250 Lesson 1 voice clips + join きく A/B (Founder-approved voices)" \
            -m "Real TTS generation, Founder-approved voice table. Writes only listen[].transcript[].start in c01.lesson.json (self-enforced by the generation script) — no other field touched, lesson-level review fields stay null, c01 stays blocked in production."
          git push origin "HEAD:${{ github.ref_name }}"

      # Paths match c01.lesson.json's own listen[].audio field (no per-lesson subdirectory for
      # these two special joined files — see the generation script's own comment on why).
      - name: Upload the two きく master files
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: listen-masters
          path: |
            public/audio/course/c01_listen_A.mp3
            public/audio/course/c01_listen_B.mp3
          retention-days: 14
