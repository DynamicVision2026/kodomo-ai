name: Send BEGINNER_LAUNCH preview emails (manual, real Postmark send)

# Founder request (2 Oct 2026): "send me the post-flip emails now... as real Postmark sends, so I
# can see them on my iPhone" — BEFORE flipping BEGINNER_LAUNCH anywhere live. Manual,
# workflow_dispatch only — never wired to push/pull_request, never touches production traffic or
# any live flag. Reuses ci.yml's/postmark-export.yml's existing Workload Identity Federation auth
# (same secrets) to read the real `email-api-key` secret from Secret Manager — the one piece this
# sandbox-run script can't do on its own, since that token only exists there. The actual email
# content comes straight from backend/src/email.ts's own template functions, called directly with
# beginnerLaunch: true — this never calls the live backend's /api/v1/auth/request endpoint (which
# would only exercise today's still-flag-off code path).

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Recipient email address'
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # Workload Identity Federation — no long-lived key ever touches this repo

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: kodomo-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Read the Postmark server token from Secret Manager
        id: secret
        run: |
          TOKEN=$(gcloud secrets versions access latest --secret=email-api-key)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Send the 3 post-flip preview emails
        env:
          EMAIL_API_KEY: ${{ steps.secret.outputs.token }}
        run: npx tsx scripts/send-beginner-launch-preview-emails.ts --to="${{ inputs.to }}"
