name: CI

on: [push, pull_request]

# ARCHITECT DECISION NEEDED (see docs/launch-runbook.md's own "CI/CD" section for the full
# writeup): this repo has no `main`/release branch today — only `claude/sprint-1-setup-ok4oym`
# (the branch this session's own work landed on, and per the Builder work order the branch
# presumed to be driving today's `kodomo-ai`/`kodomo-ai-backend` Cloud Run revisions) and one
# stale, long-diverged `fix/cloud-run-backend-routing-404` branch from the pre-AD-13 era. Wiring
# the production deploy trigger to a `claude/*`-named session branch is NOT a durable release
# architecture — a future session on a differently-named branch would silently stop deploying,
# or two "production" branches could exist at once. This workflow wires the trigger to the
# CURRENT de facto branch (below) so a normal push does NOT require a manual deploy starting
# today, but the Architect/Founder should confirm: promote `main` to the real permanent
# production branch (recommended — retarget `PRODUCTION_BRANCH` below and retire this branch
# name), or intentionally keep `claude/sprint-1-setup-ok4oym` as the long-lived production line.
env:
  PRODUCTION_BRANCH: claude/sprint-1-setup-ok4oym

jobs:
  # `gates` and `deploy-frontend`'s own `if:` below can't reference the top-level `env` context
  # above (`jobs.<job_id>.if` only has access to `github`/`vars`/`needs`/`inputs` — `env` is NOT
  # in that list; a prior version of this file referenced `env.PRODUCTION_BRANCH` there, which is
  # an invalid workflow file GitHub Actions rejects before running a single job — confirmed via
  # two real runs, both "failure" with zero jobs and no logs). This job re-exposes that same
  # branch name as a step *output*, which the env context IS valid inside (`run:` steps), so
  # `deploy-frontend` can gate on it without duplicating the branch name a second time.
  which-branch:
    runs-on: ubuntu-latest
    outputs:
      is_production: ${{ steps.check.outputs.is_production }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/${{ env.PRODUCTION_BRANCH }}" ]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
          fi

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      # --- build-breaking gates, spec v0.5 §7 ---
      - name: Gate — no free-text input in the child flow
        run: npm run gate:no-input
      - name: Gate — no hard-coded child-facing copy
        run: npm run gate:no-hardcoded
      - name: Gate — every mission's claims approved (+ review stamp on release)
        run: npm run gate:claims
      - name: Gate — no purchase/price copy in any /play string (AD-15 §6, post-incident)
        run: npm run gate:no-purchase-copy
      - name: Gate — no pre-AD-12 cream/gold theme in any /play stylesheet (post-launch-check)
        run: npm run gate:no-old-theme
      - name: Content lint (kanji grade, ruby, length, tags, banned words, PII)
        run: npm run lint:content
      - name: Unit tests
        run: npm test
      - name: Build (frontend, tsc -b + vite build)
        run: npm run build
      - name: Gate — no LLM/API hosts in the shipped bundle
        run: npm run gate:no-llm
      - name: Build (backend, tsc only — no image yet)
        run: npm run build:server
      - name: Build (admin dashboard, tsc + its own vite build)
        run: npm run build:admin

  # Founder incident follow-up (run #126/#127 diagnostic): the live kodomo-ai-backend service was
  # found to be an old prototype revision (kodomo-ai-backend-00004-cxk, deployed manually via
  # `gcloud run deploy --source`, predating this repo's /api/v1 router entirely) — every real
  # backend call has likely 404'd in production since long before the same-origin-proxy migration.
  # This job closes that gap the same way deploy-frontend already closes it for the frontend:
  # build the backend's own Dockerfile, deploy with --no-traffic, smoke test, then promote — and
  # runs BEFORE deploy-frontend so the frontend's own BACKEND_URL always resolves to a fully
  # promoted, working backend revision by the time its own smoke test hits /api/v1/me.
  deploy-backend:
    needs: [which-branch, gates]
    if: needs.which-branch.outputs.is_production == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation — no long-lived key ever touches this repo
    env:
      PROJECT_ID: kodomo-ai
      REGION: asia-northeast1
      SERVICE: kodomo-ai-backend
      AR_REPO: kodomo-ai-images
      # Architect decision (same-origin API via reverse proxy): the canonical frontend origin —
      # both the CSRF allowlist (APP_ORIGINS) and the base every emailed/redirect link is built
      # from (APP_BASE_URL). Update the day domo-ai.com goes live — see the matching comment on
      # deploy-frontend's own CANONICAL_HOST.
      CANONICAL_ORIGIN: https://kodomo-ai-421702481956.asia-northeast1.run.app
      # Founder-confirmed final sender identity (postmarkEmail.ts's own optional fromName/replyTo
      # support) — EMAIL_FROM alone was missing from the live service entirely before this.
      # EMAIL_API_KEY (the actual Postmark server token — buildEnv.ts's own buildEmailSender
      # gates PostmarkEmailSender construction on it) is a real secret, set via --set-secrets
      # below, now that the Founder has confirmed it exists in Secret Manager with
      # secretAccessor granted to this service's runtime SA and that domo-ai.com's DKIM/
      # Return-Path are verified in Postmark.
      EMAIL_FROM: no-reply@domo-ai.com
      EMAIL_FROM_NAME: ナゼホリ
      EMAIL_REPLY_TO: info@domo-ai.com
      # Founder-confirmed, from the live Shopify product JSON: kodomo-ai-m1 (product 10349669679352,
      # SKU kodomo-ai-m1, ¥4,980, requires_shipping: false) -> variant 50615530029304. Backend
      # matching itself (SKU_TO_MODULE_IDS, backend/src/shopify.ts) was already correct — this was
      # only ever missing its runtime config. See the deploy step below for why
      # SHOPIFY_VARIANT_IDS's own JSON value isn't set via a plain ${{ }} substitution here.
      SHOPIFY_SHOP_DOMAIN: soul-id-2.myshopify.com
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Verify only — never create. See deploy-frontend's own identical step for why.
      - name: Verify the Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.REGION }}" >/dev/null || {
            echo "::error::Artifact Registry repo '${{ env.AR_REPO }}' not found in ${{ env.REGION }}."
            echo "::error::Known existing repos: kodomo-ai-images, cloud-run-source-deploy — reconcile AR_REPO above, do not auto-create a new one."
            exit 1
          }

      - name: Build and push the backend image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
        run: |
          docker build -f Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Deploy with --no-traffic first, same reasoning as deploy-frontend's own step. Plain config
      # via --set-env-vars, real secrets via --set-secrets (Secret Manager, `<name>:latest`) — the
      # Founder has already granted roles/secretmanager.secretAccessor on all four secrets
      # (ADMIN_TOKEN, SHOPIFY_WEBHOOK_SECRET, AUTH_PEPPER, EMAIL_API_KEY) to this service's
      # runtime SA and removed the four placeholder plain env vars the old prototype revision
      # carried, so there's no plain-env/secret name collision here.
      - name: Deploy the candidate revision (no traffic yet)
        id: deploy
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
          TAG: candidate-${{ github.run_number }}
          # A plain shell env var, deliberately NOT referenced below via ${{ env.X }} — GH
          # Actions' own ${{ }} substitution happens BEFORE bash ever parses this script, so a
          # quote character arriving that way becomes real (and here, unbalanced) shell syntax
          # inside --set-env-vars="...". Read via ordinary bash `$VAR` expansion instead (in the
          # `run:` step below), whose quote characters are just literal text to bash, not syntax.
          SHOPIFY_VARIANT_IDS_JSON: '{"m1":"50615530029304"}'
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="$IMAGE:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --no-traffic \
            --tag="$TAG" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},APP_ORIGINS=${{ env.CANONICAL_ORIGIN }},APP_BASE_URL=${{ env.CANONICAL_ORIGIN }},EMAIL_FROM=${{ env.EMAIL_FROM }},EMAIL_FROM_NAME=${{ env.EMAIL_FROM_NAME }},EMAIL_REPLY_TO=${{ env.EMAIL_REPLY_TO }},SHOPIFY_SHOP_DOMAIN=${{ env.SHOPIFY_SHOP_DOMAIN }},SHOPIFY_VARIANT_IDS=$SHOPIFY_VARIANT_IDS_JSON" \
            --set-secrets="ADMIN_TOKEN=ADMIN_TOKEN:latest,SHOPIFY_WEBHOOK_SECRET=SHOPIFY_WEBHOOK_SECRET:latest,AUTH_PEPPER=AUTH_PEPPER:latest,EMAIL_API_KEY=EMAIL_API_KEY:latest"
          BASE_URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" --format='value(status.url)')
          CANDIDATE_URL="https://${TAG}---$(echo "$BASE_URL" | sed 's#https://##')"
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Two checks, both against the CANDIDATE revision directly (its own revision-tag URL, never
      # the canonical/production one): (1) GET /api/v1/me with no session cookie must be a real
      # app-level 401 (handleMe reached, router alive) — never 404 (route missing, the exact
      # failure runs #126/#127 found on the old prototype) or 502/503 (container didn't start);
      # (2) a Shopify webhook with a deliberately bad HMAC signature must be rejected 401 — proves
      # signature verification is wired to the real (non-placeholder) SHOPIFY_WEBHOOK_SECRET, not
      # silently accepting everything.
      - name: Smoke test the candidate revision
        run: |
          CANDIDATE_URL="${{ steps.deploy.outputs.candidate_url }}"
          FAIL=0

          ME_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${CANDIDATE_URL}/api/v1/me")
          if [ "$ME_STATUS" != "401" ]; then
            echo "::error::/api/v1/me returned ${ME_STATUS} on the candidate revision (expected 401)"
            FAIL=1
          else
            echo "OK /api/v1/me -> 401"
          fi

          WEBHOOK_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'X-Shopify-Hmac-Sha256: not-a-real-signature' \
            -H 'Content-Type: application/json' \
            --data '{"id":1,"line_items":[]}' \
            "${CANDIDATE_URL}/webhooks/shopify/orders-paid")
          if [ "$WEBHOOK_STATUS" != "401" ]; then
            echo "::error::webhook with a bad HMAC returned ${WEBHOOK_STATUS} on the candidate revision (expected 401)"
            FAIL=1
          else
            echo "OK bad-HMAC webhook -> 401"
          fi

          if [ "$FAIL" != "0" ]; then
            echo "::error::Smoke tests failed — traffic NOT promoted, production still on the previous revision."
            exit 1
          fi

      # Only reached once the candidate revision has passed every smoke test.
      - name: Promote the candidate revision to 100% traffic
        run: |
          gcloud run services update-traffic "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" \
            --to-tags="${{ steps.deploy.outputs.tag }}=100"

  # Admin dashboard work order §3 — "add a deploy-admin CI job (same commit as backend and
  # frontend) deploying kodomo-ai-admin ... with the secrets and env it needs and a smoke test."
  # A THIRD, separate Cloud Run service from deploy-backend/deploy-frontend (Dockerfile.admin's
  # own doc comment: "never merge this into Part 1 or Part 2's own deploy") — runs in parallel
  # with them (only needs gates), not after, since nothing here depends on the public backend or
  # frontend being live. Never --allow-unauthenticated: Identity-Aware Proxy is the only intended
  # entry point (work order §4) — see docs/launch-runbook.md's Part 2B for the one-time Founder
  # steps (enable IAP, grant staff access, seed staff/) this job's own deploy alone can't do.
  deploy-admin:
    needs: [which-branch, gates]
    if: needs.which-branch.outputs.is_production == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation — no long-lived key ever touches this repo
    env:
      PROJECT_ID: kodomo-ai
      REGION: asia-northeast1
      SERVICE: kodomo-ai-admin
      AR_REPO: kodomo-ai-images
      # Same canonical origin deploy-backend uses — the admin dashboard's own resend-welcome/
      # resend-claim actions build login/claim links from it (backend/src/links.ts).
      CANONICAL_ORIGIN: https://kodomo-ai-421702481956.asia-northeast1.run.app
      EMAIL_FROM: no-reply@domo-ai.com
      EMAIL_FROM_NAME: ナゼホリ
      EMAIL_REPLY_TO: info@domo-ai.com
      SHOPIFY_SHOP_DOMAIN: soul-id-2.myshopify.com
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Verify only — never create. See deploy-frontend's own identical step for why.
      - name: Verify the Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.REGION }}" >/dev/null || {
            echo "::error::Artifact Registry repo '${{ env.AR_REPO }}' not found in ${{ env.REGION }}."
            echo "::error::Known existing repos: kodomo-ai-images, cloud-run-source-deploy — reconcile AR_REPO above, do not auto-create a new one."
            exit 1
          }

      - name: Build and push the admin image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
        run: |
          docker build -f Dockerfile.admin \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Same required secrets as deploy-backend (backend/server/adminIndex.ts loads the same
      # buildEnv() — ADMIN_TOKEN/SHOPIFY_WEBHOOK_SECRET are unused by this service's own routes
      # but still required to start, since buildEnv() doesn't distinguish which service calls
      # it). IAP_AUDIENCE is deliberately NOT hardcoded here: it's only known once IAP is enabled
      # on this exact service (docs/launch-runbook.md Part 2B step 2), so it comes from the
      # `IAP_AUDIENCE` repository VARIABLE (Settings -> Secrets and variables -> Actions ->
      # Variables) the Founder sets once that value exists — read via plain bash `$VAR`
      # expansion, never `${{ }}`, for the same reason SHOPIFY_VARIANT_IDS_JSON is in
      # deploy-backend (a value that could contain characters `${{ }}` substitution would turn
      # into real shell syntax before bash ever sees this script). Built this way (append-if-set)
      # rather than always passing `IAP_AUDIENCE=${{ vars.IAP_AUDIENCE }}` specifically so a
      # normal push BEFORE the Founder has set that repo variable never overwrites a value someone
      # set by hand via `gcloud run services update-env-vars` in the meantime — `--set-env-vars`
      # replaces the WHOLE plain-env-var set on every deploy, never merges.
      - name: Deploy the candidate revision (no traffic yet)
        id: deploy
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
          TAG: candidate-${{ github.run_number }}
          IAP_AUDIENCE: ${{ vars.IAP_AUDIENCE }}
        run: |
          ENV_VARS="GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},APP_ORIGINS=${{ env.CANONICAL_ORIGIN }},APP_BASE_URL=${{ env.CANONICAL_ORIGIN }},EMAIL_FROM=${{ env.EMAIL_FROM }},EMAIL_FROM_NAME=${{ env.EMAIL_FROM_NAME }},EMAIL_REPLY_TO=${{ env.EMAIL_REPLY_TO }},SHOPIFY_SHOP_DOMAIN=${{ env.SHOPIFY_SHOP_DOMAIN }}"
          if [ -n "$IAP_AUDIENCE" ]; then
            ENV_VARS="$ENV_VARS,IAP_AUDIENCE=$IAP_AUDIENCE"
          fi
          SECRETS="ADMIN_TOKEN=ADMIN_TOKEN:latest,SHOPIFY_WEBHOOK_SECRET=SHOPIFY_WEBHOOK_SECRET:latest,AUTH_PEPPER=AUTH_PEPPER:latest,EMAIL_API_KEY=EMAIL_API_KEY:latest"

          # `--no-traffic` is rejected by gcloud on a service's very first-ever deploy ("not
          # supported when creating a new service") — there is no earlier revision for it to
          # protect traffic away from yet, and Cloud Run gives a brand new service's first
          # revision 100% traffic unconditionally regardless of --tag. kodomo-ai-admin (unlike
          # kodomo-ai/kodomo-ai-backend, both long-since-existing services) hits exactly this case
          # on its actual first deploy. Detected and handled once here; every deploy after this
          # one finds the service already exists and takes the normal tagged/no-traffic/promote
          # path. Low real risk even if this first revision were broken: --no-allow-unauthenticated
          # still holds, and IAP isn't enabled yet at this point in the rollout (docs/launch-
          # runbook.md Part 2B), so nothing but an already-IAM-authorized caller could reach it.
          if gcloud run services describe "${{ env.SERVICE }}" --region="${{ env.REGION }}" >/dev/null 2>&1; then
            gcloud run deploy "${{ env.SERVICE }}" \
              --image="$IMAGE:${{ github.sha }}" \
              --region="${{ env.REGION }}" \
              --platform=managed \
              --no-allow-unauthenticated \
              --no-traffic \
              --tag="$TAG" \
              --set-env-vars="$ENV_VARS" \
              --set-secrets="$SECRETS"
            BASE_URL=$(gcloud run services describe "${{ env.SERVICE }}" \
              --region="${{ env.REGION }}" --format='value(status.url)')
            CANDIDATE_URL="https://${TAG}---$(echo "$BASE_URL" | sed 's#https://##')"
            echo "first_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::kodomo-ai-admin does not exist yet — first-ever deploy goes live immediately (--no-traffic isn't valid until a second revision exists)."
            gcloud run deploy "${{ env.SERVICE }}" \
              --image="$IMAGE:${{ github.sha }}" \
              --region="${{ env.REGION }}" \
              --platform=managed \
              --no-allow-unauthenticated \
              --set-env-vars="$ENV_VARS" \
              --set-secrets="$SECRETS"
            CANDIDATE_URL=$(gcloud run services describe "${{ env.SERVICE }}" \
              --region="${{ env.REGION }}" --format='value(status.url)')
            echo "first_deploy=true" >> "$GITHUB_OUTPUT"
          fi
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Deploying a Cloud Run service does not, on its own, grant the deploying principal
      # run.invoker on it — invoking and deploying are deliberately separate IAM permissions.
      # deploy-backend/deploy-frontend never needed this binding (both --allow-unauthenticated);
      # kodomo-ai-admin's smoke test below is the first one here that actually calls its own
      # service authenticated. Idempotent — a no-op once already granted, so safe on every run.
      - name: Grant the deploying service account run.invoker on kodomo-ai-admin
        run: |
          gcloud run services add-iam-policy-binding "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" \
            --member="serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" \
            --role="roles/run.invoker"

      # `gcloud auth print-identity-token` (no flags) fails against the external_account
      # (Workload Identity Federation) credential auth@v2 sets up here — "No identity token can
      # be obtained from the current credentials" — because minting an OIDC ID token needs an
      # explicit audience and impersonation target; plain access-token impersonation (which the
      # deploy step above already relies on) doesn't imply that. Re-running auth@v2 with
      # `token_format: id_token` is the documented fix for exactly this "invoke a private Cloud
      # Run service from GitHub Actions" case — it mints an ID token audienced to the candidate
      # revision's own URL directly, which is also the correct audience Cloud Run's own IAM
      # auth (never IAP_AUDIENCE — that's a completely separate check, IAP's own) expects.
      - id: id-token-auth
        name: Mint an identity token for the candidate revision
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: 'id_token'
          id_token_audience: ${{ steps.deploy.outputs.candidate_url }}
          id_token_include_email: true

      # This service requires authentication (--no-allow-unauthenticated) even for the smoke
      # test itself — an identity token for the SAME deploying service account, which already
      # needs (and by deploying successfully above, already has) enough Cloud Run access on this
      # project to also invoke what it just deployed. Two checks, both against the CANDIDATE
      # revision directly: (1) /healthz -> 200 (container started, Cloud Run IAM let an
      # authenticated caller through); (2) /admin-api/me -> 401 with no IAP header attached
      # (proves the router is alive and resolveStaffIdentity correctly refuses a request that
      # didn't come through IAP) — the same invariant holds whether IAP_AUDIENCE is set yet or
      # not, so this check is meaningful both before and after the Founder finishes Part 2B.
      - name: Smoke test the candidate revision
        run: |
          CANDIDATE_URL="${{ steps.deploy.outputs.candidate_url }}"
          TOKEN="${{ steps.id-token-auth.outputs.id_token }}"
          FAIL=0

          HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "${CANDIDATE_URL}/healthz")
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "::error::/healthz returned ${HEALTH_STATUS} on the candidate revision (expected 200) — if this is 403, the deploying service account likely needs roles/run.invoker granted explicitly on kodomo-ai-admin: gcloud run services add-iam-policy-binding kodomo-ai-admin --region=${{ env.REGION }} --member=serviceAccount:${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} --role=roles/run.invoker"
            FAIL=1
          else
            echo "OK /healthz -> 200"
          fi

          ME_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "${CANDIDATE_URL}/admin-api/me")
          if [ "$ME_STATUS" != "401" ]; then
            echo "::error::/admin-api/me returned ${ME_STATUS} on the candidate revision (expected 401 — no IAP header on this direct call)"
            FAIL=1
          else
            echo "OK /admin-api/me -> 401 (no IAP header -> correctly unauthenticated)"
          fi

          if [ "$FAIL" != "0" ]; then
            if [ "${{ steps.deploy.outputs.first_deploy }}" = "true" ]; then
              echo "::error::Smoke tests failed on the service's first-ever revision — it is already live (see the 'Deploy' step's own comment on why --no-traffic can't apply here) and needs a follow-up fix/redeploy."
            else
              echo "::error::Smoke tests failed — traffic NOT promoted, production still on the previous revision."
            fi
            exit 1
          fi

      # Skipped on the service's first-ever deploy — it already has 100% traffic (Cloud Run
      # gives a brand new service's only revision all of it unconditionally; see the 'Deploy'
      # step's own comment). Only reached on a later deploy, once the candidate revision has
      # passed every smoke test.
      - name: Promote the candidate revision to 100% traffic
        if: steps.deploy.outputs.first_deploy != 'true'
        run: |
          gcloud run services update-traffic "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" \
            --to-tags="${{ steps.deploy.outputs.tag }}=100"

  # AD-16 §5 / Builder work order — "close the production deployment loop": build the frontend
  # container and deploy it to the EXISTING `kodomo-ai` Cloud Run service. Never runs on a PR
  # (forks/PRs never get deploy credentials) and never runs unless `gates` already passed —
  # a failed test/gate/build stops here, production is untouched (rule #7/#8 of the work order).
  # Depends on deploy-backend so BACKEND_URL below always resolves to a backend that has already
  # passed its own smoke test and been promoted to 100% traffic — never a still-`--no-traffic`
  # candidate or (worse) an old, broken prototype revision.
  deploy-frontend:
    needs: [which-branch, gates, deploy-backend]
    if: needs.which-branch.outputs.is_production == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation — no long-lived key ever touches this repo
    env:
      PROJECT_ID: kodomo-ai
      REGION: asia-northeast1
      SERVICE: kodomo-ai
      BACKEND_SERVICE: kodomo-ai-backend
      # Builder work order ("take ownership of production deployment"): the project already has
      # two Artifact Registry Docker repos — `kodomo-ai-images` and `cloud-run-source-deploy`
      # (Cloud Run's own auto-created default for `--source`-based deploys). Explicit constraint:
      # "Do NOT recreate infrastructure that already exists." `kodomo-ai-images` is the
      # purpose-named one (built for exactly this: pushed container images, not source uploads),
      # so it's the default here — see the "Ensure the Artifact Registry repo exists" step below,
      # which verifies rather than silently creates if this ever turns out to be wrong.
      AR_REPO: kodomo-ai-images
      # Architect decision (same-origin API via reverse proxy, post-incident): the ONE hostname
      # this service answers as itself — backend/server/frontendIndex.ts 301-redirects any other
      # Host to this (its own doc comment explains why: the OTHER default Cloud Run URL this same
      # service is also reachable at was the actual root of the CORS/session-isolation incident
      # this whole migration replaces). Update this the day the domo-ai.com custom domain goes
      # live — nothing else in this job needs to change alongside it.
      CANONICAL_HOST: kodomo-ai-421702481956.asia-northeast1.run.app
    steps:
      - uses: actions/checkout@v4

      # One-time Founder setup creates this WIF provider + service account — see
      # scripts/bootstrap-gcp-ci.sh and docs/launch-runbook.md's own "CI/CD" section. No JSON
      # key ever stored in GitHub; the OIDC token this job's own `id-token: write` permission
      # mints is what authenticates, scoped to this exact repo.
      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Verify only — never create. `kodomo-ai-images` and `cloud-run-source-deploy` already
      # exist in this project; a repo missing here means AR_REPO needs reconciling against the
      # project's real repos (`gcloud artifacts repositories list --location=${{ env.REGION }}`),
      # not that a new one should be created.
      - name: Verify the Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location="${{ env.REGION }}" >/dev/null || {
            echo "::error::Artifact Registry repo '${{ env.AR_REPO }}' not found in ${{ env.REGION }}."
            echo "::error::Known existing repos: kodomo-ai-images, cloud-run-source-deploy — reconcile AR_REPO above, do not auto-create a new one."
            exit 1
          }

      # Architect decision (same-origin API via reverse proxy): the backend's own live Cloud Run
      # URL is still resolved live (never hand-typed/stored as a static secret that could drift),
      # but it's now a RUNTIME env var on the frontend service (BACKEND_URL, --set-env-vars
      # below) — backend/server/frontendIndex.ts's own server-side `/api/*` proxy target — never
      # a build arg baked into the client bundle any more (that was the OLD, cross-origin
      # architecture the incident this replaces exposed).
      - name: Resolve the live backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe "${{ env.BACKEND_SERVICE }}" \
            --region="${{ env.REGION }}" --format='value(status.url)')
          if [ -z "$URL" ]; then
            echo "::error::kodomo-ai-backend has no live URL yet — deploy the backend first."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push the frontend image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
        run: |
          docker build -f Dockerfile.frontend \
            --build-arg VITE_SHOPIFY_PRODUCT_URL="${{ vars.VITE_SHOPIFY_PRODUCT_URL }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Deploy with --no-traffic first — a NEW revision is created and becomes reachable at its
      # own tagged URL, but the CURRENT production revision keeps serving 100% of real traffic
      # throughout. This is rule #7's "production traffic changes only after a successful
      # build/deploy" enforced as an explicit extra gate (a smoke-test failure below), not just
      # relying on Cloud Run's own container-startup health check.
      - name: Deploy the candidate revision (no traffic yet)
        id: deploy
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}
          TAG: candidate-${{ github.run_number }}
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="$IMAGE:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --no-traffic \
            --tag="$TAG" \
            --set-env-vars="CANONICAL_HOST=${{ env.CANONICAL_HOST }},BACKEND_URL=${{ steps.backend-url.outputs.url }}"
          BASE_URL=$(gcloud run services describe "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" --format='value(status.url)')
          CANDIDATE_URL="https://${TAG}---$(echo "$BASE_URL" | sed 's#https://##')"
          echo "candidate_url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Work order #9's own smoke-test list — every real route vite.config.ts's multi-page
      # `input` map builds, hit against the CANDIDATE revision specifically (not production) —
      # Cloud Run's own revision-tag hostname (containing `---`) is deliberately exempt from
      # backend/server/frontendIndex.ts's own canonical-host redirect (its own doc comment
      # explains why), so this always tests the candidate directly, never bounces to whatever is
      # currently live on the canonical host. The final check (`/api/v1/me`, expect 401 — no
      # session cookie on a fresh curl, never 502/503/404) is the same-origin reverse proxy
      # reaching the real backend end to end, the actual mechanism this whole migration exists
      # for — a broken BACKEND_URL/proxy would 502 or 503 here, not silently pass.
      - name: Smoke test the candidate revision
        run: |
          CANDIDATE_URL="${{ steps.deploy.outputs.candidate_url }}"
          FAIL=0
          for path in / /play/ /login/ /account/ /claim/ /legal/privacy/ /legal/tokushoho/; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${CANDIDATE_URL}${path}")
            if [ "$STATUS" != "200" ]; then
              echo "::error::${path} returned ${STATUS} on the candidate revision"
              FAIL=1
            else
              echo "OK ${path} -> 200"
            fi
          done
          API_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${CANDIDATE_URL}/api/v1/me")
          if [ "$API_STATUS" != "401" ]; then
            echo "::error::/api/v1/me returned ${API_STATUS} on the candidate revision (expected 401 — the same-origin proxy to the backend isn't working)"
            FAIL=1
          else
            echo "OK /api/v1/me -> 401 (proxy reaches the real backend)"
          fi
          if [ "$FAIL" != "0" ]; then
            echo "::error::Smoke tests failed — traffic NOT promoted, production still on the previous revision."
            exit 1
          fi

      # Only reached once the candidate revision has passed every smoke test — this is the one
      # moment production traffic actually changes. The revision this replaces remains fully
      # deployed and selectable via `gcloud run services update-traffic` for an instant rollback.
      - name: Promote the candidate revision to 100% traffic
        run: |
          gcloud run services update-traffic "${{ env.SERVICE }}" \
            --region="${{ env.REGION }}" \
            --to-tags="${{ steps.deploy.outputs.tag }}=100"
