name: WO-C4 beginner course audio (manual, never touches production)

# Founder decision (27 Sep 2026): a manual, separate workflow — never wired to `push`/`pull_request`
# — for generating the beginner course's (b01–b07 + ending) voiced audio from
# content/course/beginner/beginner.audio-sheet.csv. Voices are already Founder-approved (identical
# table to Lesson 1's own voice-samples.yml run), so there is no samples-approval gate here — only
# `check` (free access/enablement check) and `full` (the real generation run).
#
# Nothing here ever reaches production: `public/audio/course/<lessonId>/…` is real, servable audio
# (WO-C4b's own "keep the final full set … stored the same way as c01's audio"), but the beginner
# lessons have no lesson.json yet and are not wired into CourseApp.tsx — that is explicitly
# separate, later work ("still don't add the lessons to the app"). Intermediate per-line/per-gap
# clips and the check-reel's own scratch files stay under a gitignored top-level audio/ directory,
# never committed — see scripts/audio/generate-beginner-audio.ts's own file header. c01–c06
# content and audio, the production content gate, and ci.yml's own deploy jobs are never read or
# written by this workflow.
#
# `full` mode commits the FULL final set — every file under public/audio/course/ this run produces,
# plus content/course/beginner/beginner.timings.json — back to this run's own dispatch branch
# (never main). WO-C4b's own check reel, `fix-check.mp3` (the new b_ending.mp3 + 10 お母さん lines
# picked across lessons), is uploaded as its own workflow artifact, `beginner-audio-fixcheck`, and
# is never committed (it's a review aid, not production content).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        type: choice
        options:
          - check
          - full
        default: check

permissions:
  contents: write   # 'full' mode commits public/audio/course/** + beginner.timings.json back to the dispatch branch
  id-token: write   # Workload Identity Federation — no long-lived key ever touches this repo

jobs:
  beginner-audio:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: kodomo-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Same REST-transport convention as voice-samples.yml (Founder decision, 26 Sep 2026) — one
      # masked bearer token authenticates every REST call generate-beginner-audio.ts makes below.
      - name: Mint a REST access token
        id: token
        run: |
          TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Check Text-to-Speech access + API enablement
        env:
          GCP_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: npx tsx scripts/audio/generate-beginner-audio.ts --check

      - name: Validate the sheet (dry run — no token/ffmpeg needed)
        run: npx tsx scripts/audio/generate-beginner-audio.ts --dry-run

      - name: Install ffmpeg
        if: ${{ inputs.mode == 'full' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      # Generates the 749 final files under public/audio/course/<lessonId>/ (committed below),
      # writes content/course/beginner/beginner.timings.json, and builds fix-check.mp3 under the
      # gitignored audio/course/_fixcheck/ (uploaded as an artifact, never committed).
      - name: Generate all beginner-course audio
        if: ${{ inputs.mode == 'full' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.token.outputs.token }}
        run: npx tsx scripts/audio/generate-beginner-audio.ts --full

      # Self-check before trusting the run: only public/audio/course/** and beginner.timings.json
      # may have changed — never c01–c06's own content or audio, never the content gate, never
      # anything else under public/ or src/. Also excludes google-github-actions/auth@v2's own
      # exported-credentials file (`gha-creds-*.json`, written to the repo root and removed by that
      # action's own "Post Authenticate" cleanup step, which runs AFTER this one) — a real false
      # positive caught on this workflow's first (WO-C4) run; it is never staged or committed
      # either way, so excluding it from this check widens nothing.
      - name: Confirm only public/audio/course + timings.json changed
        if: ${{ inputs.mode == 'full' }}
        run: |
          CHANGED=$(git status --porcelain -- . ':!public/audio/course/**' ':!content/course/beginner/beginner.timings.json' ':!gha-creds-*.json')
          if [ -n "$CHANGED" ]; then
            echo "::error::Unexpected changes outside public/audio/course/** and beginner.timings.json:"
            echo "$CHANGED"
            exit 1
          fi
          echo "OK: only public/audio/course/** and content/course/beginner/beginner.timings.json changed."

      - name: Commit the beginner-course audio + timings.json
        if: ${{ inputs.mode == 'full' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio/course content/course/beginner/beginner.timings.json
          git commit -m "WO-C4b: audio fix run - お母さん pitch, real ふたり overlay, END-L04 pause; commit full 749-file set" \
            -m "Real TTS generation, Founder-approved voice table (お母さん pitch -1.0, every other role unchanged from Lesson 1's table). Stored under public/audio/course/ the same way as c01's own audio, ready for the app later; beginner lessons are still not wired into CourseApp.tsx."
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload the beginner-audio-fixcheck artifact
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: beginner-audio-fixcheck
          path: audio/course/_fixcheck/fix-check.mp3
          retention-days: 30
